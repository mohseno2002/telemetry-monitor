<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#155b75">
<title>مِرصد التليمترى — لوحة الترعة والنقطة</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مِرصد التليمترى">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#faf8f2; --paper-2:#f3efe4; --sand:#e9dfc8;
  --lake:#247ba0; --lake-deep:#155b75; --green:#4d7c5a; --field:#dce8d7;
  --ink:#243238; --muted:#66736f; --clay:#b46f4b;
  --line:#ded6c5; --white:#ffffffd6; --amber:#c58a2f;
  --danger:#b8503f; --danger-bg:#f6e7e3;
  --shadow:0 10px 30px #4d432c14, 0 2px 4px #4d432c0d;
  --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--paper);-webkit-text-size-adjust:100%;overflow-x:hidden}
body{color:var(--ink);background:var(--paper);line-height:1.5;-webkit-font-smoothing:antialiased;
  font-family:"IBM Plex Sans Arabic","Noto Kufi Arabic","Segoe UI",Tahoma,Arial,sans-serif}
button{cursor:pointer;color:inherit;font:inherit}
.app-shell{background:
   radial-gradient(circle at 8% 0%, #247ba014, transparent 28%),
   linear-gradient(#ffffff70,#ffffff70),
   repeating-linear-gradient(120deg, transparent 0 72px, #b46f4b06 73px 74px),
   var(--paper);
  display:grid;grid-template-columns:1fr 248px;min-height:100vh}
@media(max-width:1000px){.app-shell{grid-template-columns:1fr}.side-nav{display:none!important}}
.side-nav{grid-area:1/2;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:22px 16px;border-left:1px solid var(--line);background:rgba(249,247,239,.94);backdrop-filter:blur(18px)}
.brand-mark{display:grid;grid-template-columns:46px 1fr;grid-template-rows:36px 20px;
  align-items:center;height:78px;margin-bottom:16px;padding:8px 12px}
.brand-mark>span{grid-row:1/3;width:42px;height:42px;display:grid;place-items:center}
.brand-mark img{width:42px;height:42px;border-radius:13px 13px 13px 4px;display:block}
.brand-mark b{align-self:end;margin-right:10px;font-size:18px}
.brand-mark small{align-self:start;margin-right:10px;font-size:8px;letter-spacing:1.6px;color:var(--lake)}
.side-nav nav{display:flex;flex-direction:column;gap:4px;overflow-y:auto;margin:0 -6px;padding:0 6px}
.side-nav nav button{display:flex;align-items:center;gap:11px;width:100%;min-height:44px;
  padding:8px 12px;border:0;border-radius:12px;background:none;color:#59645f;
  font-size:12.5px;font-weight:600;text-align:right;transition:.18s}
.side-nav nav button:hover{background:#f0ece0}
.side-nav nav button.active{background:#e6f0ed;color:var(--lake-deep);box-shadow:inset -3px 0 var(--lake)}
.nav-icon{display:grid;place-items:center;width:26px;height:26px;flex:0 0 auto;
  border:1px solid currentColor;border-radius:8px;font-size:14px;opacity:.92}
.nav-num{margin-right:auto;font-family:var(--mono);font-size:9px;opacity:.5}
.nav-foot{display:grid;grid-template-columns:10px 1fr;align-items:center;gap:4px 7px;
  margin-top:12px;padding:14px 8px 2px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
.main{grid-area:1/1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;
  gap:12px;min-height:88px;padding:14px 26px;border-bottom:1px solid var(--line);
  background:rgba(250,248,242,.86);backdrop-filter:blur(16px)}
.eyebrow{display:block;margin-bottom:5px;color:var(--lake);font-size:9px;font-weight:800;letter-spacing:.4px}
.topbar h1{font-size:18px;font-weight:700}
.content{width:100%;max-width:1240px;padding:20px 26px 40px}
@media(max-width:1000px){.topbar,.content{padding-inline:14px}.topbar h1{font-size:15px}}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
@media(max-width:1000px){.g6,.g4{grid-template-columns:repeat(2,1fr)}.g3,.g2{grid-template-columns:1fr}}
.panel{margin-top:14px;padding:18px;border:1px solid var(--line);border-radius:16px;
  background:var(--white);box-shadow:var(--shadow)}
.panel h2{font-size:15px;font-weight:700}
.panel .sub{margin-top:3px;color:var(--muted);font-size:11px}
.field{padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.field .lbl{font-size:9.5px;font-weight:700;color:var(--muted);margin-bottom:4px}
.field .val{font-family:var(--mono);font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.field.hi{background:linear-gradient(135deg,#e9f2f5,#f4f7f2);border-color:#c8dbdd}
.field.hi .val{color:var(--lake-deep);font-size:18px}
.kpi{display:flex;gap:11px;align-items:flex-start;padding:14px;border:1px solid var(--line);
  border-radius:14px;background:var(--white);box-shadow:var(--shadow)}
.kpi i{display:grid;place-items:center;width:40px;height:40px;flex:0 0 auto;border-radius:12px;
  background:#e8f0f1;border:1px solid #c8d9d9;color:var(--lake-deep);font-size:18px;font-style:normal}
.kpi.green i{background:#edf4e8;border-color:#c8d9bd;color:var(--green)}
.kpi.sand i{background:#f5eee1;border-color:#e3d3bd;color:var(--clay)}
.kpi.bad i{background:var(--danger-bg);border-color:#e6c6be;color:var(--danger)}
.kpi .lbl{font-size:10px;font-weight:600;color:var(--muted);margin-bottom:2px}
.kpi .big{font-family:var(--mono);font-size:22px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .big u{text-decoration:none;font-family:inherit;font-size:10px;font-weight:500;color:var(--muted);margin-right:3px}
.kpi .sub{margin-top:3px;font-size:9.5px;color:var(--muted)}
select,input[type=text],input[type=date],input[type=number]{width:100%;min-height:42px;padding:8px 11px;
  border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-size:12.5px}
label.fl{display:block;margin-bottom:5px;font-size:10px;font-weight:700;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:9px 15px;
  border:1px solid var(--line);border-radius:11px;background:#fff;color:#4c5854;
  font-size:11.5px;font-weight:600;transition:.15s}
.btn:hover{border-color:var(--lake);color:var(--lake-deep)}
.btn.solid{border:0;background:linear-gradient(135deg,var(--lake),var(--lake-deep));color:#fff;
  box-shadow:0 6px 14px #247ba026}
.btn.sm{min-height:34px;padding:6px 11px;font-size:10.5px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:9px;font-weight:700}
.pill.lake{background:#e6f0f4;color:var(--lake-deep)}
.pill.green{background:#edf4e8;color:var(--green)}
.pill.sand{background:#f5eee1;color:var(--clay)}
.pill.danger{background:var(--danger-bg);color:var(--danger)}
table{width:100%;border-collapse:collapse;font-size:11.5px}
th{position:sticky;top:0;z-index:2;padding:9px 8px;border-bottom:1px solid var(--line);
  background:var(--paper-2);color:var(--muted);font-size:10px;font-weight:700;text-align:right}
td{padding:8px;border-bottom:1px solid #efeadd;font-variant-numeric:tabular-nums}
tr.bad td{background:#fbf1ee}
.tw{max-height:430px;margin-top:12px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
svg.chart{display:block;width:100%;height:280px}
.chartbox{margin-top:12px;overflow:hidden}
.legend{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:10px;font-size:10px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;margin-left:5px;border-radius:2px;vertical-align:-1px}
.note{margin-top:9px;font-size:11px;line-height:1.85;color:var(--muted)}
.state{padding:22px 14px;text-align:center;color:var(--muted);font-size:12px}
.state b{display:block;margin-bottom:6px;color:var(--ink);font-size:13px}
.stamp{display:inline-block;padding:3px 9px;border-radius:999px;background:#edf4e8;color:var(--green);
  font-size:9.5px;font-weight:700}
.stamp.warn{background:#f5eee1;color:var(--clay)}
.stamp.bad{background:var(--danger-bg);color:var(--danger)}
.skel{height:60px;border-radius:10px;background:linear-gradient(90deg,#efeade,#f7f4ea,#efeade);
  background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.serial{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;
  margin-top:14px;padding:16px;border:1.5px dashed var(--green);border-radius:14px;background:#f7faf5}
.serial b{font-family:var(--mono);font-size:19px;letter-spacing:2px;color:var(--ink)}
.serial-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:12px;font-size:10.5px;color:var(--muted)}
.serial-legend span b{font-family:var(--mono);font-size:11px;color:var(--lake-deep);letter-spacing:0}
.alert-row{display:flex;gap:9px;align-items:flex-start;padding:9px 11px;margin-top:7px;
  border-radius:10px;background:var(--danger-bg);color:#7d3527;font-size:11.5px}
.alert-row.warn{background:#f7f0e2;color:#7a5417}
.alert-row b{font-family:var(--mono)}
.mobsel{display:none;margin-bottom:14px}
@media(max-width:1000px){.mobsel{display:block}}
.rowflex{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
@media print{.side-nav,.topbar .actions,.mobsel{display:none}.app-shell{display:block}}
</style>
</head>

/* ============ أدوات ============ */
function el(t,a,k){var e=document.createElement(t);a=a||{};
  for(var n in a){if(n==="class")e.className=a[n];else if(n==="html")e.innerHTML=a[n];

  (k||[]).forEach(function(c){if(c==null)return;
    e.appendChild(typeof c==="object"&&c.nodeType?c:document.createTextNode(String(c)));});
  return e;}
function q(i){return document.getElementById(i);}
function fx(v,n){if(v===null||v===undefined||v==="")return "—";return Number(v).toFixed(n===undefined?2:n);}
function dayStr(di){var d=new Date(BASEDATE.getTime()+di*86400000);
  var m=d.getUTCMonth()+1,dd=d.getUTCDate();
  return d.getUTCFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd;}
function diOf(s){return Math.round((Date.parse(s+"T00:00:00Z")-BASEDATE.getTime())/86400000);}
function isBad(v){return v!==null&&(SENT.indexOf(v)>-1||v===FAULT||v<0);}
function flagOf(v){if(v===null)return null;
  if(v===SENT[0])return "راية 777";if(v===SENT[1])return "راية 888";
  if(v===FAULT)return "قيمة افتراضية 5.00";if(v<0)return "قيمة سالبة";return null;}
function mean(a){if(!a.length)return null;var s=0;for(var i=0;i<a.length;i++)s+=a[i];return s/a.length;}
function median(a){if(!a.length)return null;var b=a.slice().sort(function(x,y){return x-y;});
  var m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2;}

/* ============ الأرشيف ============ */
var SITES=[],BYID={},MAXDI=0;
function loadArchive(){
  var raw=q("ARCHIVE").textContent.trim(),lines=raw.split("\n");
  for(var i=0;i<lines.length;i++){
    var L=lines[i];if(!L)continue;
    var p=L.split("|"),site={id:p[0],name:p[1],dir:p[2],rows:[]};
    var segs=p[3]?p[3].split(","):[];
    for(var j=0;j<segs.length;j++){
      var s=segs[j].split(":"),dh=s[0].split(".");
      var di=parseInt(dh[0],10),hh=parseInt(dh[1],10);
      if(di>MAXDI)MAXDI=di;
      site.rows.push({di:di,h:hh,up:s[1]===""?null:parseFloat(s[1]),dn:s[2]===""?null:parseFloat(s[2])});
    }
    site.canal=canalOf(site.name);
    site.km=kmOf(site.name);
    SITES.push(site);BYID[site.id]=site;
  }
  SITES.sort(function(a,b){return a.name.localeCompare(b.name,"ar");});
}
function canalOf(n){
  if(n.indexOf("سماعيلي")>-1||n.indexOf("المحسمة")>-1||n.indexOf("المنايف")>-1)return "ترعة الإسماعيلية";
  if(n.indexOf("السويس")>-1||n.indexOf("الشلوفة")>-1)return "ترعة السويس";
  if(n.indexOf("بورسعيد")>-1)return "ترعة بورسعيد";
  if(n.indexOf("الصالحية")>-1||n.indexOf("السعيدية")>-1||n.indexOf("الملاك")>-1)return "ترعة الصالحية";
  return "غير مصنَّف";
}
function kmOf(n){
  var t=n.replace(/[٠-٩]/g,function(c){return "٠١٢٣٤٥٦٧٨٩".indexOf(c);});
  if(t.indexOf("فم")===0)return 0;
  var m=/(\d+(?:\.\d+)?)/.exec(t);
  return m?parseFloat(m[1]):null;
}

/* ============ إحصاء ============ */
var STATS={};
function daily(site,fromDi,toDi){
  var by={};
  site.rows.forEach(function(r){
    if(fromDi!==undefined&&(r.di<fromDi||r.di>toDi))return;
    if(r.up===null||isBad(r.up)||r.up===0)return;
    (by[r.di]=by[r.di]||[]).push(r.up);
  });
  var out=[];
  Object.keys(by).forEach(function(k){out.push({di:parseInt(k,10),v:mean(by[k]),n:by[k].length});});
  out.sort(function(a,b){return a.di-b.di;});
  return out;
}
function statsOf(site){
  var ok=0,f={},vals=[],last=null,zero=0;
  site.rows.forEach(function(r){
    var fl=flagOf(r.up)||flagOf(r.dn);
    if(fl)f[fl]=(f[fl]||0)+1;
    else if(r.up===0)zero++;
    else ok++;
    if(r.up!==null&&!isBad(r.up)&&r.up>0)vals.push(r.up);
    if(!last||r.di>last.di||(r.di===last.di&&r.h>last.h))last=r;
  });
  return {n:site.rows.length,ok:ok,flags:f,zero:zero,last:last,
    min:vals.length?Math.min.apply(null,vals):null,
    max:vals.length?Math.max.apply(null,vals):null,
    avg:mean(vals),health:site.rows.length?ok/site.rows.length:0};
}
function computeStats(){SITES.forEach(function(s){STATS[s.id]=statsOf(s);});}

/* الشواذ: انحراف مطلق متوسط عن الوسيط (MAD) على المتوسط اليومى */
function anomalies(site){
  var d=daily(site),v=d.map(function(x){return x.v;});
  if(v.length<7)return {rows:d,list:[],lo:null,hi:null};
  var med=median(v);
  var dev=v.map(function(x){return Math.abs(x-med);});
  var mad=median(dev)||0.001;
  var lo=med-3*1.4826*mad,hi=med+3*1.4826*mad;
  var list=[];
  d.forEach(function(x){if(x.v<lo||x.v>hi)list.push({di:x.di,v:x.v,dir:x.v>hi?"ارتفاع":"انخفاض"});});
  return {rows:d,list:list,lo:lo,hi:hi,med:med};
}
/* أيام بها قراءات صفرية */
function zeroDays(site){
  var by={};
  site.rows.forEach(function(r){if(r.up===0)by[r.di]=(by[r.di]||0)+1;});
  return Object.keys(by).map(function(k){return {di:parseInt(k,10),n:by[k]};})
    .sort(function(a,b){return b.di-a.di;});
}
/* تنبؤ إحصائى: انحدار خطى على آخر N يوماً */
function forecast(site,days,ahead){
  var d=daily(site);
  if(d.length<5)return null;
  var seg=d.slice(-days);
  var n=seg.length,sx=0,sy=0,sxx=0,sxy=0;
  seg.forEach(function(p,i){sx+=i;sy+=p.v;sxx+=i*i;sxy+=i*p.v;});
  var den=n*sxx-sx*sx;
  if(!den)return null;
  var b=(n*sxy-sx*sy)/den,a=(sy-b*sx)/n;
  var res=seg.map(function(p,i){return p.v-(a+b*i);});
  var sd=Math.sqrt(mean(res.map(function(r){return r*r;}))||0);
  var out=[];
  for(var k=1;k<=ahead;k++)out.push({di:seg[seg.length-1].di+k,v:a+b*(n-1+k),sd:sd});
  return {hist:seg,pred:out,slope:b,sd:sd};
}

/* ---- دمج القراءات الحديثة من القاعدة داخل الأرشيف المضمّن ----
   الأرشيف داخل الملف ثابت عند تاريخ البناء؛ هذه الدالة تمدّه بما كتبه
   الجالب بعد ذلك، فتظهر أحدث الأيام فى لوحتَى الترعة والنقطة. */
var MERGED={added:0,newest:null,err:null};
function putRow(site,di,h,up,dn){
  if(di<0||isNaN(di)||isNaN(h))return false;
  for(var i=site.rows.length-1;i>=0;i--){
    var r=site.rows[i];
    if(r.di===di&&r.h===h){r.up=up;r.dn=dn;return false;}
    if(r.di<di)break;
  }
  site.rows.push({di:di,h:h,up:up,dn:dn});
  if(di>MAXDI)MAXDI=di;
  return true;
}
function sortRows(){
  SITES.forEach(function(s){s.rows.sort(function(a,b){return (a.di-b.di)||(a.h-b.h);});});
}
function mergeLatest(){
  MERGED={added:0,newest:null,err:null};
  var jobs=[
    fbGet("apps/"+BRIDGE+"/live/wl").catch(function(){return null;}),
    fbGet("apps/"+BRIDGE+"/archive").catch(function(){return null;})
  ];
  return Promise.all(jobs).then(function(res){
    var wl=res[0],arc=res[1],k,sid,site,di;
    if(wl&&wl.sites&&wl.date){
      di=diOf(wl.date);
      for(sid in wl.sites){
        site=BYID[sid];if(!site)continue;
        var v=wl.sites[sid];
        var hh=(v.hour===null||v.hour===undefined)?null:Number(v.hour);
        if(hh===null||isNaN(hh))continue;
        if(putRow(site,di,hh,v.up===undefined?null:v.up,v.dn===undefined?null:v.dn))MERGED.added++;
      }
    }
    if(arc){
      for(sid in arc){
        site=BYID[sid];if(!site)continue;
        var byDate=arc[sid];
        for(var dstr in byDate){
          var dd=diOf(dstr);
          var hours=byDate[dstr];
          for(var hk in hours){
            var hn=parseInt(String(hk).replace(/[^0-9]/g,""),10);
            var cell=hours[hk]||{};
            if(putRow(site,dd,hn,cell.up===undefined?null:cell.up,cell.dn===undefined?null:cell.dn))MERGED.added++;
          }
        }
      }
    }
    sortRows();
    computeStats();
    MERGED.newest=dayStr(MAXDI);
  }).catch(function(e){MERGED.err=e.message;});
}

/**
 * رسم خطى عام
 * series: [{name,color,pts:[{x,y,flag,dash}],dash:bool,marks:bool}]
 */
function chart(series,opts){
  opts=opts||{};
  var W=920,H=opts.h||280,padL=54,padR=16,padT=14,padB=44;
  var xs=[],ys=[];
  series.forEach(function(s){s.pts.forEach(function(p){if(p.y===null||p.y===undefined)return;
    xs.push(p.x);ys.push(p.y);if(p.y2!==undefined&&p.y2!==null)ys.push(p.y2);});});
  if(!ys.length)return emptyState("لا توجد قيم معتمدة","كل القراءات فى هذا النطاق رايات أو فراغات.");
  var xmin=opts.xmin!==undefined?opts.xmin:Math.min.apply(null,xs);
  var xmax=opts.xmax!==undefined?opts.xmax:Math.max.apply(null,xs);
  if(xmax===xmin)xmax=xmin+1;
  var ymin=Math.min.apply(null,ys),ymax=Math.max.apply(null,ys);
  if(ymax-ymin<0.05){ymax+=0.05;ymin-=0.05;}
  var pad=(ymax-ymin)*0.14;ymin-=pad;ymax+=pad;
  function X(v){return padL+(W-padL-padR)*(v-xmin)/(xmax-xmin);}
  function Y(v){return padT+(H-padT-padB)*(1-(v-ymin)/(ymax-ymin));}
  var svg=svgNS("svg",{viewBox:"0 0 "+W+" "+H,"class":"chart",preserveAspectRatio:"none"});
  var i;
  for(i=0;i<=4;i++){
    var gv=ymin+(ymax-ymin)*i/4,gy=Y(gv);
    svg.appendChild(svgNS("line",{x1:padL,x2:W-padR,y1:gy,y2:gy,stroke:"#e6e0d0","stroke-width":1}));
    svg.appendChild(svgNS("text",{x:padL-8,y:gy+4,"text-anchor":"end","font-size":11,fill:"#66736f",
      "font-family":"IBM Plex Mono"},gv.toFixed(opts.yd===undefined?2:opts.yd)));
  }
  var ticks=opts.ticks||6;
  for(i=0;i<=ticks;i++){
    var tv=xmin+(xmax-xmin)*i/ticks;
    svg.appendChild(svgNS("text",{x:X(tv),y:H-20,"text-anchor":"middle","font-size":10,fill:"#66736f"},
      opts.xfmt?opts.xfmt(tv):tv.toFixed(0)));
  }
  if(opts.band){
    var yb1=Y(opts.band[1]),yb2=Y(opts.band[0]);
    svg.appendChild(svgNS("rect",{x:padL,y:yb1,width:W-padL-padR,height:Math.max(1,yb2-yb1),
      fill:"#4d7c5a14"}));
  }
  var cols=["#247ba0","#b46f4b","#4d7c5a","#c58a2f","#8a6bbf"];
  series.forEach(function(s,si){
    var col=s.color||cols[si%cols.length],d="",open=false;
    if(s.bandOf){
      var up="",dn2="",first=true;
      s.pts.forEach(function(p){
        if(p.y===null)return;
        up+=(first?"M":"L")+X(p.x).toFixed(1)+" "+Y(p.y+p.sd).toFixed(1)+" ";
        first=false;});
      var rev=s.pts.slice().reverse();
      rev.forEach(function(p){if(p.y===null)return;
        dn2+="L"+X(p.x).toFixed(1)+" "+Y(p.y-p.sd).toFixed(1)+" ";});
      if(up)svg.appendChild(svgNS("path",{d:up+dn2+"Z",fill:col+"22",stroke:"none"}));
    }
    s.pts.forEach(function(p){
      if(p.y===null||p.y===undefined){open=false;return;}
      d+=(open?"L":"M")+X(p.x).toFixed(1)+" "+Y(p.y).toFixed(1)+" ";open=true;});
    if(d){var at={d:d,fill:"none",stroke:col,"stroke-width":2,"stroke-linejoin":"round","stroke-linecap":"round"};
      if(s.dash)at["stroke-dasharray"]="6 4";
      svg.appendChild(svgNS("path",at));}
    if(s.marks!==false)s.pts.forEach(function(p){
      if(p.y===null||p.y===undefined)return;
      if(p.flag)svg.appendChild(svgNS("circle",{cx:X(p.x),cy:Y(p.y),r:3.4,fill:"#b8503f"}));
      else if(s.dots)svg.appendChild(svgNS("circle",{cx:X(p.x),cy:Y(p.y),r:3,fill:col}));
    });
    if(s.labels)s.pts.forEach(function(p){
      if(p.y===null||!p.label)return;
      svg.appendChild(svgNS("text",{x:X(p.x),y:Y(p.y)-9,"text-anchor":"middle","font-size":9.5,
        fill:"#4c5854"},p.label));});
  });
  if(opts.xtitle)svg.appendChild(svgNS("text",{x:(padL+W-padR)/2,y:H-4,"text-anchor":"middle",
    "font-size":10,fill:"#66736f"},opts.xtitle));
  if(opts.ytitle)svg.appendChild(svgNS("text",{x:14,y:padT+10,"font-size":10,fill:"#66736f"},opts.ytitle));
  var box=el("div",{"class":"chartbox"});box.appendChild(svg);
  var lg=el("div",{"class":"legend"});
  series.forEach(function(s,si){
    lg.appendChild(el("span",{html:'<i style="background:'+(s.color||cols[si%cols.length])+'"></i>'+s.name}));});
  if(opts.legendExtra)lg.appendChild(el("span",{html:opts.legendExtra}));
  box.appendChild(lg);
  return box;
}
function bars(items,opts){
  opts=opts||{};
  var W=920,H=opts.h||250,padL=54,padR=16,padT=14,padB=52;
  if(!items.length)return emptyState("لا توجد بيانات","");
  var mx=Math.max.apply(null,items.map(function(i){return i.v;}));
  if(mx<=0)mx=1;
  var svg=svgNS("svg",{viewBox:"0 0 "+W+" "+H,"class":"chart",preserveAspectRatio:"none"});
  var i,gv,gy;
  for(i=0;i<=4;i++){gv=mx*i/4;gy=padT+(H-padT-padB)*(1-i/4);
    svg.appendChild(svgNS("line",{x1:padL,x2:W-padR,y1:gy,y2:gy,stroke:"#e6e0d0","stroke-width":1}));
    svg.appendChild(svgNS("text",{x:padL-8,y:gy+4,"text-anchor":"end","font-size":11,fill:"#66736f",
      "font-family":"IBM Plex Mono"},gv.toFixed(opts.yd===undefined?1:opts.yd)));}
  var bw=(W-padL-padR)/items.length;
  items.forEach(function(it,k){
    var h=(H-padT-padB)*(it.v/mx),x=padL+bw*k+bw*0.18,w=bw*0.64;
    svg.appendChild(svgNS("rect",{x:x,y:padT+(H-padT-padB)-h,width:w,height:Math.max(1,h),
      fill:it.color||"#9fc0d4",rx:3}));
    svg.appendChild(svgNS("text",{x:x+w/2,y:padT+(H-padT-padB)-h-5,"text-anchor":"middle",
      "font-size":9.5,fill:"#4c5854","font-family":"IBM Plex Mono"},it.v.toFixed(opts.vd===undefined?1:opts.vd)));
    svg.appendChild(svgNS("text",{x:x+w/2,y:H-30,"text-anchor":"middle","font-size":9,fill:"#66736f"},it.label));
    if(it.label2)svg.appendChild(svgNS("text",{x:x+w/2,y:H-18,"text-anchor":"middle","font-size":8.5,
      fill:"#8b948f"},it.label2));
  });
  var box=el("div",{"class":"chartbox"});box.appendChild(svg);return box;
}

function canalCode(n){

function csv(name,head,rows){
  var out="\uFEFF"+head.join(",")+"\n";
  rows.forEach(function(r){out+=r.map(function(x){
    var s=String(x===null||x===undefined?"":x);
    return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(",")+"\n";});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([out],{type:"text/csv;charset=utf-8"}));
  a.download=name+".csv";document.body.appendChild(a);a.click();document.body.removeChild(a);
}

    var cnt={};s.rows.forEach(function(r){cnt[r.di]=(cnt[r.di]||0)+1;});
    var row=el("div",{style:"display:flex;gap:2px;align-items:center"},[
      el("span",{style:"width:104px;flex:0 0 104px;font-size:9px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis",title:s.name},[s.name])]);
    for(var d=0;d<=MAXDI;d++){
      var n=cnt[d]||0;
      var col=n===0?"#efeadd":(n>=24?"#4d7c5a":(n>=12?"#c58a2f":(n>1?"#d9a441":"#b46f4b")));
      row.appendChild(el("i",{style:"width:11px;height:11px;border-radius:2px;display:block;background:"+col,
        title:s.name+" — "+dayStr(d)+" — "+n+" قراءة"}));}
    cov.appendChild(row);});
  c.appendChild(panel("التغطية اليومية","عدد القراءات لكل موقع فى كل يوم",null,[
    cov,
    el("div",{"class":"legend"},[
      el("span",{html:'<i style="background:#4d7c5a"></i>٢٤ قراءة'}),
      el("span",{html:'<i style="background:#c58a2f"></i>١٢ فأكثر'}),
      el("span",{html:'<i style="background:#b46f4b"></i>قراءة واحدة (تسجيل يومى)'}),
      el("span",{html:'<i style="background:#efeadd"></i>لا قراءة'})]),
    el("div",{"class":"note"},["التسجيل قبل ١٥ يوليو ٢٠٢٦ كان قراءة واحدة يومياً الساعة ٢٣:٠٠ — لذلك يظهر الجانب الأيسر بلون واحد. أى متوسط يخلط الفترتين مضلِّل."])]));
}

/* ============ التصيير ============ */
function render(){
  var c=q("content");c.innerHTML="";
  c.appendChild(mobileNav());
  if(CUR==="canal")secCanal(c);
  else if(CUR==="point")secPoint(c);
  else if(CUR==="alerts")secAlerts(c);
  else if(CUR==="pumps")secPumps(c);
  else if(CUR==="export")secExport(c);
  else if(CUR==="quality")secQuality(c);
  c.appendChild(el("div",{"class":"note",style:"text-align:center;margin-top:22px"},
    ["مِرصد التليمترى — بيلد "+BUILD+" · المصدر: الإدارة المركزية للرصد المائى والتليمترى · المدى المتاح "+
     dayStr(0)+" ← "+dayStr(MAXDI)+
     (MERGED.added?" · أُضيفت "+MERGED.added+" قراءة من القاعدة":"")+
     (MERGED.err?" · تعذّر الدمج: "+MERGED.err:"")]));
}

/* ============ التثبيت ============ */
var deferredPrompt=null;
function showHint(t){
  var o=q("hintbar");if(o&&o.parentNode)o.parentNode.removeChild(o);
  var bar=el("div",{id:"hintbar",style:"position:fixed;inset-inline:12px;bottom:14px;z-index:99;"+
    "background:#155b75;color:#fff;border-radius:12px;padding:14px 16px;font-size:12.5px;"+
    "box-shadow:0 10px 30px #4d432c33;display:flex;gap:12px;align-items:center"},[t]);
  var x=el("button",{"class":"btn sm",style:"margin-inline-start:auto;background:#ffffff22;border:0;color:#fff"},["إغلاق"]);
  x.onclick=function(){if(bar.parentNode)bar.parentNode.removeChild(bar);};
  bar.appendChild(x);document.body.appendChild(bar);
}
function setupInstall(){
  var b=q("btn-install");if(!b)return;
  if((window.matchMedia&&window.matchMedia("(display-mode: standalone)").matches)||
     window.navigator.standalone===true)return;
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault();deferredPrompt=e;b.style.display="inline-flex";});
  window.addEventListener("appinstalled",function(){deferredPrompt=null;b.style.display="none";});
  b.onclick=function(){
    if(deferredPrompt){deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function(){deferredPrompt=null;b.style.display="none";});}
    else showHint("لتثبيت التطبيق: افتح قائمة المتصفح ثم اختر «إضافة إلى الشاشة الرئيسية».");};
  if(/iPhone|iPad|iPod/.test(navigator.userAgent||""))b.style.display="inline-flex";
}

/* ============ الإقلاع ============ */
function boot(){
  q("verlbl").textContent="build "+BUILD;
  loadArchive();computeStats();loadUser();buildNav();go("canal");
  loadLive().then(mergeLatest).then(function(){render();
    fbPatch("registry/"+APPID,{app:APPID,name:"مِرصد التليمترى",type:"dashboard",
      version:BUILD,lastSeen:Date.now()});});
  q("btn-refresh").onclick=function(){
    SEL.date=null;
    loadLive().then(mergeLatest).then(render);};
  q("btn-print").onclick=function(){window.print();};
  setupInstall();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
}
boot();
</script>
